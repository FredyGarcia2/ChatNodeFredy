<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica de evaluación Socket</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Librería Socket.io desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
</head>
<body>

    <!-- Panel de Bienvenida -->
    <div id="panel-bienvenida">
        <h2>Práctica de evaluación usando Sockets de comunicación - Ing. Alex R.G.</h2>
        <input id="persona" type="text" placeholder="Ingresa tu nombre">
        <button id="ingresar" onclick="ingresarAlChat()">Ingresar al chat</button>
    </div>

    <!-- Aplicación del Chat -->
    <div id="app-chat" style="display:none;">
        <h2>Práctica de evaluación 1er. parcial - Ing. Alex R.G.</h2>
        <span class="nube box">Chat con socket</span>

        <div id="ventana-mensajes">
            <div id="output"></div>
            <div id="escribiendo-mensaje"></div>
        </div>

        <input id="usuario" type="text" placeholder="Tu nombre" readonly>
        <input id="mensaje" type="text" placeholder="Ingresa un mensaje">

        <!-- Selector de archivos para adjuntar fotos, videos, audios o documentos -->
        <div style="margin: 10px 0;">
            <label style="font-size: 13px; color: #555; padding: 0;">Adjuntar archivo (opcional):</label>
            <input id="archivo" type="file" style="margin-top: 5px;">
        </div>

        <button id="enviar">Enviar</button>
    </div>

    <script src="/chat.js"></script>
</body>
</html>
